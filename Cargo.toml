[workspace]
members = ["cli", "commons", "market_making"]
resolver = "2"

[workspace.dependencies]
anchor-lang = "0.31.1"
anchor-spl = "0.31.1"
anchor-client = "0.31.1"

solana-sdk = "2.2.1"
spl-associated-token-account = "6.0.0"
solana-transaction-status = "2.2.4"
solana-account-decoder = "2.2.4"
spl-memo = "6.0.0"
spl-transfer-hook-interface = "0.9.0"

serde_json = "1.0.149"
serde = "1.0.228"
bincode = "1.3.3"
bs58 = "0.5.1"
bytemuck = "1.25.0"

clap = "4.6.0"
shellexpand = "3.1.2"

env_logger = "0.9.0"
log = "0.4.17"

rust_decimal = "1.40.0"
ruint = "1.17.2"
num-integer = "0.1.45"
num-traits = "0.2.16"

hyper = "0.14.32"
routerify = "3"

tokio = "1.50.0"
futures-util = "0.3.32"
async-trait = "0.1.89"

anyhow = "1.0.102"

rand = "0.8.5"

chrono = "0.4.44"

ureq = "2.12.1"

itertools = "0.10.0"

commons = { path = "./commons" }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
